<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="../images/logo.png">

    
</head>
<body>
    <header class="header-register">

    <div class="logo-register">

        <a href="index.html">
            <img src="../images/logo.png" alt="logo">
        </a>

        <h2>TRAVELVIET</h2>

        <span>Đăng Ký</span>

    </div>

    <div class="header-right">

        <p>Bạn đã có tài khoản?</p>

        <a href="login.html">
            Đăng nhập
        </a>

    </div>

</header>
    <section class="register-page">
    <div class="gioi-thieu">
        <h1>Khám phá Việt Nam</h1>
        <h2>Đi để yêu hơn!</h2>

        <p>
            Tạo tài khoản ngay hôm nay để nhận nhiều ưu đãi hấp dẫn
            và trải nghiệm những hành trình tuyệt vời cùng TravelViet.
        </p>
    </div>

    <div class="register-box">

        <h1>ĐĂNG KÝ TÀI KHOẢN</h1>

        <form id="registerForm">

            <input type="text" id="fullname" placeholder="Họ và tên">

            <input type="email" id="email" placeholder="Email">

            <input type="tel" id="phone" placeholder="Số điện thoại">

            <input type="password" id="password" placeholder="Mật khẩu">

            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">

            <div class="dieu-khoan">
                <input type="checkbox" id="agree">
                <span>
                    Tôi đồng ý với Điều khoản sử dụng
                </span>
            </div>

            <button type="submit" class="btn-register">
                Đăng ký
            </button>

            <div class="hoac">
                <span>Hoặc đăng ký với</span>
            </div>

            <div class="social-login">

            <button type="button" class="google">
                <i class="fa-brands fa-google"></i>
                    Đăng ký với Google
            </button>

             <button type="button" class="facebook">
                 <i class="fa-brands fa-facebook-f"></i>
                    Đăng ký với Facebook
            </button>

        </div>

        </form>

    </div>

</section>
<script src="../js/register.js"></script>
</body>
</html>
