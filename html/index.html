<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Bán Hàng</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">ShopMax</div>

        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Khuyến mãi</a>
            <a href="#">Liên hệ</a>
        </nav>

        <div class="cart">
            🛒 Giỏ hàng
        </div>
    </header>

    <!-- BANNER -->
    <section class="banner">
        <div class="banner-text">
            <h1>Giảm giá đến 50%</h1>
            <p>Mua sắm sản phẩm công nghệ giá tốt</p>
            <button>Mua ngay</button>
        </div>
    </section>

    <!-- PRODUCT -->
    <section class="products">

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Iphone 14</h3>
            <p>20.000.000đ</p>
            <button>Mua ngay</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Laptop Gaming</h3>
            <p>25.000.000đ</p>
            <button>Mua ngay</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Tai nghe Sony</h3>
            <p>3.000.000đ</p>
            <button>Mua ngay</button>
        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 ShopMax</p>
    </footer>

</body>
</html>
